plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blaupunkt.tsviewer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blaupunkt.tsviewer'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
